name: iirs
instrument: IIRS
gsd_m: 80.0
bit_depth: 16
normalise:
  method: percentile
  low: 2.0
  high: 98.0
clahe:
  enabled: false
  clip: 2.5
  tiles: 8
shadow_threshold: 0.05
texture_threshold: 0.010
nodata: 0

# IIRS is an imaging spectrometer, so a cube has to become one raster before any
# matcher sees it. These bound the reflected-light window used to build the
# pseudo-pan; past ~2.5 um a lunar daytime spectrum is the surface's own thermal
# emission, which tracks temperature rather than albedo or shape and does not
# resemble the reflected-light reference it would be matched against.
# See backend/seleno/tool/spectral.py. Exports remain a single pseudo-pan band.
spectral:
  pseudo_pan_lo_um: 0.8
  pseudo_pan_hi_um: 1.6
  max_bands: 48

# Preserve enough cross-track samples for correlation on long IIRS strips.
# The runtime memory cap uses the target window area, including its aspect ratio.
registration:
  max_side: 6144
  grid: [12, 12]
